name: Reconcile Spec Kit clarifications

on:
  push:
    branches:
      - laravel-replatform
    paths:
      - '.github/workflows/reconcile-spec-kit.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply evidence-backed reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          register = root / 'docs/replatform/product-clarification-register.md'
          text = register.read_text()
          old = "| Q-032 | Tenant visual identity | Logo and print header are not currently required. | Current plans fix application-level presentation. | Branding only. | LOW | Is tenant-specific visual identity required at launch? | OPEN |"
          new = "| Q-032 | Tenant visual identity | This question duplicated the branding scope already decided by Q-013. | Q-013 approves tenant name, logo, company data, and report header/footer while retaining Master Plan IT shell branding. | Branding only. | LOW | Is tenant-specific visual identity required at launch? | ANSWERED BY Q-013 — tenant report/print identity is included and configurable; optional branding fields remain optional. |"
          if old not in text:
              raise SystemExit('Expected open Q-032 row not found')
          text = text.replace(old, new)
          text = text.replace('| LOW | 2 | 0 | 2 |', '| LOW | 2 | 1 | 1 |')
          text = text.replace('| **Total** | **33** | **15** | **18** |', '| **Total** | **33** | **16** | **17** |')
          register.write_text(text)

          log = root / 'docs/replatform/clarification-log.md'
          text = log.read_text().rstrip() + '\n'
          row = "| Q-032 | Closed as a duplicate of Q-013. Tenant name, logo, company data, and report header/footer are configurable for tenant-facing output; application-shell branding remains Master Plan IT and optional branding fields remain optional. | 2026-08-03 | Tenant settings; reporting contracts; product clarification register. | No additional product choice is introduced; the prior Q-013 decision resolves this lower-priority duplicate. |\n"
          if '| Q-032 |' not in text:
              text += row
          log.write_text(text)

          approved = root / 'docs/replatform/approved-decisions.md'
          text = approved.read_text()
          old = 'These decisions are closed. Questions Q-016 onward remain open and must not be inferred from this document.'
          new = 'These decisions are closed. Q-032 is also closed as a duplicate already resolved by Q-013. All remaining open questions are listed explicitly in `product-clarification-register.md` and must not be inferred from this document.'
          if old not in text:
              raise SystemExit('Expected approved-decisions footer not found')
          approved.write_text(text.replace(old, new))

          model = root / 'specs/007-tenancy-and-access-control/data-model.md'
          text = model.read_text()
          old = '- disabled users retain historical authorship and audit references.'
          new = '- historical actor references must not be silently rewritten; the exact treatment of records, open assignments, and disabled-user references remains open under Q-017.'
          if old not in text:
              raise SystemExit('Expected disabled-user statement not found')
          model.write_text(text.replace(old, new))

          replacements = {
              'Questions `Q-016` onward remain explicitly open and must not be guessed by an implementation agent.':
                  'All remaining open questions are listed in `docs/replatform/product-clarification-register.md` and must not be guessed by an implementation agent.',
              'Questions Q-016 onward in `docs/replatform/product-clarification-register.md` and the remaining items in `docs/replatform/open-questions.md`; none may be resolved implicitly by the coding agent.':
                  'The open items in `docs/replatform/product-clarification-register.md` and `docs/replatform/open-questions.md` remain unresolved; none may be resolved implicitly by the coding agent.',
              '**Forbidden work.** Do not resolve Q-016 onward, add impersonation, add shared mutable business catalogues, or introduce separate tenant databases/domains without an approved requirement.':
                  '**Forbidden work.** Do not resolve any question still marked `OPEN` in the clarification registers, add impersonation, add shared mutable business catalogues, or introduce separate tenant databases/domains without an approved requirement.',
              'Product questions Q-016 onward remain open and cannot be decided by the coding agent.':
                  'Product questions still marked `OPEN` in the clarification register cannot be decided by the coding agent.',
              'Open product questions: Q-016 onward in `docs/replatform/product-clarification-register.md`':
                  'Open product questions: all items still marked `OPEN` in `docs/replatform/product-clarification-register.md`',
              'Q-016 onward remain open. In particular, implementation must not invent inactive-tenant access, deactivated-user assignment handling, attachment retention/deletion, detailed export scope, audit retention, backup/restore scope, import collisions, notifications, or destructive confirmations.':
                  'The remaining open questions in the clarification register stay unresolved. In particular, implementation must not invent inactive-tenant access, deactivated-user assignment handling, attachment retention/deletion, detailed export scope, audit retention, backup/restore scope, import collisions, notifications, or destructive confirmations.'
          }
          for path in root.rglob('*.md'):
              text = path.read_text()
              original = text
              for source, target in replacements.items():
                  text = text.replace(source, target)
              if text != original:
                  path.write_text(text)

          validation = root / 'docs/replatform/package-validation.md'
          text = validation.read_text()
          text = text.replace(
              '- Q-001 through Q-015 are recorded as answered.',
              '- Q-001 through Q-015 are recorded as answered; Q-032 is closed as a duplicate resolved by Q-013.'
          )
          validation.write_text(text)

          tasks = root / 'specs/007-tenancy-and-access-control/tasks.md'
          text = tasks.read_text()
          text = text.replace(
              '- [ ] Close remaining `BLOCKING` and `HIGH` questions in the clarification register.',
              '- [ ] Close the nine remaining `HIGH` questions Q-016 through Q-024 in the clarification register.'
          )
          tasks.write_text(text)
          PY

      - name: Regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          manifest = root / 'docs/replatform/file-manifest.md'
          rows = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path == manifest or '.git' in path.parts or '.github' in path.parts:
                  continue
              data = path.read_bytes()
              rows.append((path.as_posix(), len(data), hashlib.sha256(data).hexdigest()))
          text = '# File manifest\n\nGenerated from the converged documentation tree after propagation of approved decisions Q-001 through Q-015 and closure of Q-032 as subsumed by Q-013.\n`docs/replatform/file-manifest.md` is excluded from its own hash list.\n\n| Path | Bytes | SHA-256 |\n|---|---:|---|\n'
          text += '\n'.join(f'| `{path}` | {size} | `{digest}` |' for path, size, digest in rows) + '\n'
          manifest.write_text(text)
          PY

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-spec-kit.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Validate converged Spec Kit
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -path ./.git -prune -o -type f -print | wc -l)" -eq 105
          unexpected="$(find . -path ./.git -prune -o -type f ! -name '*.md' -print)"
          test -z "$unexpected"
          find . -path ./.git -prune -o -type f -print | while read -r path; do
            case "$path" in
              ./README.md|./.specify/*|./docs/*|./specs/*) ;;
              *) echo "Unexpected path: $path"; exit 1 ;;
            esac
          done
          grep -q 'ANSWERED BY Q-013' docs/replatform/product-clarification-register.md
          grep -q 'BLOCKING | 11 | 11 | 0' docs/replatform/product-clarification-register.md
          grep -q 'HIGH | 13 | 4 | 9' docs/replatform/product-clarification-register.md
          grep -q 'LOW | 2 | 1 | 1' docs/replatform/product-clarification-register.md
          grep -q 'Total.*33.*16.*17' docs/replatform/product-clarification-register.md
          grep -q 'exact treatment of records, open assignments, and disabled-user references remains open under Q-017' specs/007-tenancy-and-access-control/data-model.md
          test -z "$(grep -RIl --include='*.md' 'Q-016 onward' . || true)"
          test -z "$(grep -RIl --include='*.md' '| Administrator | Administrator |' . || true)"
          test -z "$(grep -RIl --include='*.md' 'Multi-tenant data isolation unless OQ-003 is resolved.' . || true)"
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          broken = []
          for path in root.rglob('*.md'):
              text = path.read_text()
              for target in re.findall(r'\[[^\]]*\]\(([^)]+)\)', text):
                  clean = target.split('#')[0]
                  if not clean or '://' in clean or clean.startswith('mailto:') or clean.startswith('#'):
                      continue
                  candidate = (path.parent / clean).resolve()
                  try:
                      candidate.relative_to(root.resolve())
                  except ValueError:
                      continue
                  if not candidate.exists():
                      broken.append((str(path), target))
          if broken:
              raise SystemExit(f'Broken relative links: {broken[:20]}')
          PY

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: reconcile remaining Spec Kit clarifications"
          git push origin HEAD:laravel-replatform
