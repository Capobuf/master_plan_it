openapi: 3.1.0
info:
  title: Master Plan IT first-party API
  version: 1.0.0
  description: >-
    Static contract for the Laravel API-only backend. The browser uses relative
    same-origin paths through the public React proxy. Laravel is private behind
    that proxy; its internal origin is never sent to browser JavaScript. This
    is not a public developer API.
x-error-contract: >-
  Every error response includes the stable error envelope and, when available,
  the same identifier in the X-Correlation-ID response header. Unexpected 500
  responses use the Unexpected response component below.
servers:
  - url: /
    description: Same-origin frontend proxy (Laravel remains private)
tags:
  - name: Authentication
  - name: Context and tenants
  - name: Identity and planning
  - name: Master data
  - name: Expenses
  - name: Contracts
  - name: Reporting
paths:
  /sanctum/csrf-cookie:
    get:
      tags: [Authentication]
      operationId: sanctumCsrfCookie
      summary: Establish the Sanctum SPA CSRF cookie
      description: Infrastructure endpoint; call before login or a state-changing request when required.
      responses:
        '204': {description: CSRF cookie established}
        default: {$ref: '#/components/responses/Unexpected'}
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Start a first-party session
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/User'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimitError'}
        default: {$ref: '#/components/responses/Unexpected'}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      security: [{sessionAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses: {'500': {$ref: '#/components/responses/Unexpected'}, '204': {$ref: '#/components/responses/NoContent'}, '401': {$ref: '#/components/responses/Unauthenticated'}}
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: currentUser
      security: [{sessionAuth: []}]
      responses: {'500': {$ref: '#/components/responses/Unexpected'}, '200': {$ref: '#/components/responses/User'}, '401': {$ref: '#/components/responses/Unauthenticated'}}
  /api/v1/auth/password:
    put:
      tags: [Authentication]
      operationId: changeOwnPassword
      security: [{sessionAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordChangeRequest'}}}}
      responses: {'500': {$ref: '#/components/responses/Unexpected'}, '204': {$ref: '#/components/responses/NoContent'}, '401': {$ref: '#/components/responses/Unauthenticated'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/context:
    get:
      tags: [Context and tenants]
      operationId: currentContext
      security: [{sessionAuth: []}]
      responses: {'500': {$ref: '#/components/responses/Unexpected'}, '200': {$ref: '#/components/responses/Context'}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /api/v1/context/leave:
    post:
      tags: [Context and tenants]
      operationId: leaveTenantContext
      security: [{sessionAuth: []}]
      x-ability: platform.tenants.view
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses: {'500': {$ref: '#/components/responses/Unexpected'}, '204': {$ref: '#/components/responses/NoContent'}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /api/v1/tenants:
    get:
      tags: [Context and tenants]
      operationId: listTenants
      security: [{sessionAuth: []}]
      x-ability: platform.tenants.view
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PerPage'}]
      responses: {'500': {$ref: '#/components/responses/Unexpected'}, '200': {$ref: '#/components/responses/Tenants'}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      tags: [Context and tenants]
      operationId: createTenant
      security: [{sessionAuth: []}]
      x-ability: platform.tenants.create
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TenantWrite'}}}}
      responses: {'500': {$ref: '#/components/responses/Unexpected'}, '200': {$ref: '#/components/responses/Tenant'}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/tenants/{tenant}:
    parameters: [{$ref: '#/components/parameters/TenantId'}]
    get:
      tags: [Context and tenants]
      operationId: showTenant
      security: [{sessionAuth: []}]
      x-ability: platform.tenants.view
      responses: {'500': {$ref: '#/components/responses/Unexpected'}, '200': {$ref: '#/components/responses/Tenant'}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
    put:
      tags: [Context and tenants]
      operationId: updateTenant
      security: [{sessionAuth: []}]
      x-ability: platform.tenants.update
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TenantUpdate'}}}}
      responses: {'500': {$ref: '#/components/responses/Unexpected'}, '200': {$ref: '#/components/responses/Tenant'}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/tenants/{tenant}/enter:
    post:
      tags: [Context and tenants]
      operationId: enterTenantContext
      security: [{sessionAuth: []}]
      x-ability: platform.tenants.view
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      responses: {'500': {$ref: '#/components/responses/Unexpected'}, '200': {$ref: '#/components/responses/Tenant'}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/v1/tenants/{tenant}/deactivate:
    post:
      tags: [Context and tenants]
      operationId: deactivateTenant
      security: [{sessionAuth: []}]
      x-ability: platform.tenants.deactivate
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeactivateRequest'}}}}
      responses: {'500': {$ref: '#/components/responses/Unexpected'}, '200': {$ref: '#/components/responses/Tenant'}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/tenants/{tenant}/reactivate:
    post:
      tags: [Context and tenants]
      operationId: reactivateTenant
      security: [{sessionAuth: []}]
      x-ability: platform.tenants.reactivate
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LockVersionRequest'}}}}
      responses: {'500': {$ref: '#/components/responses/Unexpected'}, '200': {$ref: '#/components/responses/Tenant'}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/users:
    get:
      tags: [Identity and planning]
      operationId: listUsers
      security: [{sessionAuth: []}]
      x-ability: platform.users.manage
      parameters: [{$ref: '#/components/parameters/Search'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PerPage'}]
