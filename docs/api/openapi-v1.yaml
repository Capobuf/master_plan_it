components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Laravel Sanctum first-party session cookie; bearer tokens are rejected.
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PerPage: {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 15}}
    Search: {name: q, in: query, schema: {type: string}}
    Active: {name: active, in: query, schema: {type: boolean}}
    PlanningYearQuery: {name: planning_year_id, in: query, schema: {type: integer, minimum: 1}, description: Alias `year` is accepted by the current controller.}
    CostCenterQuery: {name: cost_center_id, in: query, schema: {type: integer, minimum: 1}, description: Alias `cost_center` is accepted by the current controller.}
    TenantId: {name: tenant, in: path, required: true, schema: {type: integer, minimum: 1}}
    UserId: {name: user, in: path, required: true, schema: {type: integer, minimum: 1}}
    RoleId: {name: role, in: path, required: true, schema: {type: integer, minimum: 1}}
    PlanningYearId: {name: planningYear, in: path, required: true, schema: {type: integer, minimum: 1}}
    VendorId: {name: vendor, in: path, required: true, schema: {type: integer, minimum: 1}}
    CostCenterId: {name: costCenter, in: path, required: true, schema: {type: integer, minimum: 1}}
    ExpenseId: {name: expense, in: path, required: true, schema: {type: integer, minimum: 1}}
    RowId: {name: row, in: path, required: true, schema: {type: integer, minimum: 1}}
    ContractId: {name: contract, in: path, required: true, schema: {type: integer, minimum: 1}}
    TermId: {name: term, in: path, required: true, schema: {type: integer, minimum: 1}}
    VersionId: {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    Year: {name: year, in: path, required: true, schema: {type: integer, minimum: 1}}
    SourceKey: {name: sourceKey, in: path, required: true, schema: {type: string, pattern: '^[A-Fa-f0-9]{64}$'}}
  requestBodies:
    Empty:
      description: This operation accepts no request fields; a non-empty body is rejected with 422.
      required: false
      content: {application/json: {schema: {$ref: '#/components/schemas/EmptyObject'}}}
  responses:
    NoContent: {description: Mutation completed successfully.}
    User: {description: User resource, content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}
    Context: {description: Current context, content: {application/json: {schema: {$ref: '#/components/schemas/ContextResponse'}}}}
    Tenant: {description: Tenant resource, content: {application/json: {schema: {$ref: '#/components/schemas/TenantResponse'}}}}
    Tenants: {description: Paginated tenant resources, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedTenantResponse'}}}}
    Users: {description: Paginated user resources, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedUserResponse'}}}}
    Role: {description: Role resource, content: {application/json: {schema: {$ref: '#/components/schemas/RoleResponse'}}}}
    Roles: {description: Role collection, content: {application/json: {schema: {$ref: '#/components/schemas/CollectionRoleResponse'}}}}
    Abilities: {description: Ability collection, content: {application/json: {schema: {$ref: '#/components/schemas/CollectionAbilityResponse'}}}}
    PlanningYear: {description: Planning-year resource, content: {application/json: {schema: {$ref: '#/components/schemas/PlanningYearResponse'}}}}
    PlanningYears: {description: Planning-year collection, content: {application/json: {schema: {$ref: '#/components/schemas/CollectionPlanningYearResponse'}}}}
    Vendor: {description: Vendor resource, content: {application/json: {schema: {$ref: '#/components/schemas/VendorResponse'}}}}
    Vendors: {description: Paginated vendor resources, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedVendorResponse'}}}}
    CostCenter: {description: Cost-center resource, content: {application/json: {schema: {$ref: '#/components/schemas/CostCenterResponse'}}}}
    CostCenters: {description: Cost-center collection/tree, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedCostCenterResponse'}}}}
    Revisions: {description: Paginated revision resources, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedRevisionResponse'}}}}
    Expense: {description: Expense detail resource, content: {application/json: {schema: {$ref: '#/components/schemas/ExpenseResponse'}}}}
    Expenses: {description: Paginated expense register, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedExpenseResponse'}}}}
    Contract: {description: Contract detail resource, content: {application/json: {schema: {$ref: '#/components/schemas/ContractResponse'}}}}
    Contracts: {description: Paginated contracts, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedContractResponse'}}}}
    ContractRevisions: {description: Paginated contract revision resources, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedRevisionResponse'}}}}
    GeneratedExpense: {description: Generated expense resource, content: {application/json: {schema: {$ref: '#/components/schemas/GeneratedExpenseResponse'}}}}
    MutationData: {description: Operation result, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResponse'}}}}
    ReportingDataset: {description: Reporting dataset, content: {application/json: {schema: {$ref: '#/components/schemas/ReportingDatasetResponse'}}}}
    ReportLines: {description: Paginated economic report, content: {application/json: {schema: {$ref: '#/components/schemas/ReportLinesResponse'}}}}
    Unauthenticated: {description: Unauthenticated, headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: Permission or context denied, headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: Not found or protected existence, headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Conflict: {description: Stale or domain conflict, headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ValidationError: {description: Validation failure, headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    RateLimitError: {description: Rate limited login, headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unexpected: {description: Unexpected server error, headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  headers:
    CorrelationId: {description: Correlation identifier also present in the error payload when available., schema: {type: string}}
  schemas:
    EmptyObject: {type: object, additionalProperties: false, maxProperties: 0}
    LoginRequest:
      type: object
