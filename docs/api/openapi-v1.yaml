      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserUpdate'}}}}
      responses: {'500': {$ref: '#/components/responses/Unexpected'}, '200': {$ref: '#/components/responses/User'}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/users/{user}/roles:
    put:
      tags: [Identity and planning]
